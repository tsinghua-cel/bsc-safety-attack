cd = "b"
citation = "@inproceedings{li2027validator, author = {Li, Rujia and Zhang, Mingfei and Duan, Sisi}, title = {Be Careful about Validator Switch: A Safety Attack to Binance Smart Chain}, booktitle = {2027 IEEE Symposium on Security and Privacy (SP)}, year = {2027} }"
license_url = ""
infrastructure_url = "https://aws.amazon.com/"
infrastructure_resources = "https://github.com/tsinghua-cel/bsc-safety-attack/blob/main/repro/INFRASTRUCTURE.md"
infrastructure_allocation = "Use the first configuration for Attack 1, Attack 2, the parameter-adjustment experiments, and the supplementary repair workflows: one dedicated Linux or Docker environment for the local 21-validator BSC testnet. Use the second configuration for the geo-distributed delivery experiment (implemented by the repository's legacy attack-3-code workflow): three dedicated Ubuntu 24.04 x86_64 EC2 instances, with seven validators in each of Singapore (ap-southeast-1), US Virginia (us-east-1), and London (eu-west-2). Allow TCP/UDP ports 30311-30331 between the instances and restrict SSH/RPC access to evaluator or operator IPs. The public IPs in the author's experiment configuration are deployment-specific; evaluators must substitute their own hosts."
install_script = "https://github.com/tsinghua-cel/bsc-safety-attack/blob/main/install-dev.sh"
use = "The paper evaluates four experiment families: Attack 1 (warm-up attack), Attack 2 (committee divergence attack), parameter-adjustment experiments, and a geo-distributed delivery experiment (selective delivery). The repository's attack-3-code label is a legacy implementation name for the delivery experiment, not a third paper attack or a fifth evaluation question. The artifact and its included logs and CSV files are intended only for reproducing and validating these controlled experiments on isolated BSC test networks, and for developing or testing analysis tools on these data. They are not suitable for production BSC, public validator networks, production telemetry, a representative blockchain dataset, or a security benchmark for unrelated systems. Attack 1, Attack 2, the parameter-adjustment experiments, and the repair workflows use a local logical testbed, while the delivery experiment requires three geographically distributed AWS regions. The CSV files are derived from archived validator logs. Exact results may vary because of software versions, validator scheduling, machine load, network topology, latency, and timing jitter. The artifact must not be used against production infrastructure."
destructive = "The scripts can install packages on remote Linux hosts, start and stop validator processes, clean or overwrite blockchain data and generated node directories, and download or retain large experiment logs. Cleanup commands may delete local testnet data under the configured node directories. Running the geo-distributed delivery experiment on AWS may incur cloud charges. The artifact must be run only on dedicated test instances with test keys and must never be connected to production BSC validators or networks."
claim1 = "Attack 1 (the warm-up attack) can cause the two attack branches to record different local validator-set configurations and stop finalizing at approximately height 996 before the scheduled validator-set switch. Their matching-attestation counts fall to 11 and 4, respectively, below the threshold of 14. After the switch at h + delta, the counts rise to 16 and 17, and finalization resumes independently on both branches, demonstrating that branch-local validator-set activation can enable conflicting finalization."
script1 = "https://github.com/tsinghua-cel/bsc-safety-attack/blob/main/README.md#launching-experiments"
expected1 = "When the Attack 1 flow is run with the epoch_1000_interval_450 and turn-length-8 configuration, the benchmark and both attack branches should initially have the same finalized height. After the attack starts, both attack branches should remain at approximately finalized height 996 while the benchmark continues to advance. The matching-attestation counts should be approximately 11 on c1 and 4 on c2, both below the threshold of 14. After the local validator-set switch at h + delta (the paper places the switch at slot 1087; in the reference CSV, the first recorded 16/17 matching-attestation row is slot 1089 and finalization resumes at slot 1090), the counts should increase to approximately 16 and 17, and both branches should resume finalization independently. Reference outputs are testdata/epoch_1000_interval_450_turnlength_8/csv/attack_1_finalized_heights.csv and testdata/epoch_1000_interval_450_turnlength_8/csv/matching_attestations.csv."
claim2 = "The committee divergence attack can cause two attack branches to stall at approximately finalized height 996 from slot 999 until the branch-local validator-set switch around slot 1087, while their accumulated difficulties remain close. After the switch, both branches resume finalization independently and conflicting blocks are finalized, violating consensus safety."
script2 = "https://github.com/tsinghua-cel/bsc-safety-attack/blob/main/README.md#launching-experiments"
expected2 = "When the Attack 2 flow is run with the epoch_1000_interval_450 and turn-length-8 configuration, the benchmark should reach approximately finalized height 1085 by slot 1087, while both attack branches remain near finalized height 996 until the branch-local validator-set switch. The accumulated difficulties of the two branches should remain close and alternate without either branch gaining a decisive advantage. After the switch, both branches should resume finalization independently; in the reference CSV, the first post-stall finalized-height row is recorded at slot 1097. Logs should show different source hashes for corresponding finalized target heights on the two branches, demonstrating conflicting finalization. Reference outputs are testdata/epoch_1000_interval_450_turnlength_8/csv/attack_2_finalized_heights.csv and testdata/epoch_1000_interval_450_turnlength_8/csv/attack_2_total_difficulty.csv."
claim3 = "The parameter-adjustment experiment shows that the committee divergence attack remains effective across the tested BSC protocol configurations, including different epoch lengths, block intervals, and turnLength values. In all tested configurations, finalization stalls before the validator-set switch and resumes independently on the two attack branches after branch-local validator-set activation, resulting in a safety violation."
script3 = "https://github.com/tsinghua-cel/bsc-safety-attack/blob/main/README.md#collected-test-data-testdata"
expected3 = "For each tested configuration, the attack branches should stop finalizing before the validator-set switch and resume finalization after branch-local validator-set activation. The four reference directories correspond to the paper's Table 2 configurations: epoch_200_interval_1000_turnlength_1 (S=200, 1 s, L=1; resume h+14/h+15), epoch_200_interval_3000_turnlength_1 (S=200, 3 s, L=1; h+14/h+15), epoch_200_interval_1000_turnlength_8 (S=200, 1 s, L=8; h+91/h+94), and epoch_1000_interval_450_turnlength_8 (S=1000, 0.45 s, L=8; h+94/h+94). The archived CSVs are derived finalized-height observations, so their first recorded post-stall row can occur a few slots after the paper's resume offset. The qualitative result remains the same: both branches can continue independently and finalize conflicting blocks."
claim4 = "The geo-distributed delivery experiment shows that selective delivery can influence which sibling backup block is first received and voted for by honest Singapore validators. When the relative lead of the US-routed sibling b2 is increased, equivalently by delaying the direct delivery of b1, Singapore votes shift from b1 toward b2, with the transition beginning around 75 ms."
script4 = "https://github.com/tsinghua-cel/bsc-safety-attack/blob/main/repro/REPRODUCE.md"
expected4 = "When the geo-distributed delivery experiment is run with ten attack slots for each lead_time, Singapore validators should select b1 at the lower lead_time values and begin selecting b2 as the relative lead of the US-routed sibling increases. In the reference run, b1 wins 10 of 10 slots at 30 ms and 60 ms, b2 wins 2 of 10 slots at 75 ms, and b2 wins 3 of 10 slots at 90 ms. Exact per-slot outcomes may vary because of network latency and timing jitter, but the transition from predominantly b1 votes toward some b2 votes should be observable. The reference summary is repro/attack_logs/combined_results.txt, with per-lead results under repro/attack_logs/lead_30/, lead_60/, lead_75/, and lead_90/."
hw = "Attack 1, Attack 2, the parameter-adjustment experiments, and repair use the first configuration: one dedicated Linux or Docker environment capable of running the local 21-validator BSC testnet. The geo-distributed delivery experiment uses the second configuration: three dedicated Ubuntu 24.04 x86_64 EC2 instances in Singapore, US Virginia, and London, with seven validators per instance. The reproduction guide lists t2.xlarge instances with 4 vCPUs and 16 GiB RAM, while the paper reports m5.4xlarge instances with 16 vCPUs and 64 GiB RAM; the evaluator should use the instance size selected for the validated evaluation run. Dedicated storage is needed for blockchain data, build artifacts, and experiment logs. No GPU is required."
sw = "Attack 1, Attack 2, the parameter-adjustment experiments, and repair use a Linux or Docker environment with Bash, Git, standard build tools, Python 3.12 with virtual-environment and pip support, Poetry, jq, unzip, Node.js 18.20.2 with npm 6.14.6, Go 1.21 or newer, and Foundry v1.2.1. The geo-distributed delivery experiment additionally requires a local macOS or Linux driver with OpenSSH and SCP, and remote Ubuntu Linux hosts with outbound Internet access. The included BSC modules declare Go 1.24.0, so a Go 1.21 bootstrap may select or download a newer toolchain; the Docker environment uses Go 1.24.4. No proprietary software, GUI, or non-Linux runtime is required."
api = "No API keys for online paid services are required by the artifact. The geo-distributed delivery experiment requires access to three AWS EC2 instances and the corresponding SSH private keys. AWS account permissions may be needed to provision and manage those instances, but the reproduction scripts use SSH and SCP and do not call the AWS API directly."
